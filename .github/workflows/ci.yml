name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U ci_user && break || sleep 1
          done

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run formatters & linters (check)
        working-directory: backend
        run: |
          black --check app || (echo "black failed"; exit 1)
          ruff check app || (echo "ruff failed"; exit 1)

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/ci_db
          PYTHONPATH: .
        working-directory: backend
        run: |
          export DATABASE_URL=postgresql://ci_user:ci_pass@127.0.0.1:5432/ci_db
          alembic upgrade heads
          pytest -q

      - name: Alembic upgrade (double-check)
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/ci_db
        working-directory: backend
        run: |
          export DATABASE_URL=postgresql://ci_user:ci_pass@127.0.0.1:5432/ci_db
          alembic upgrade heads
